# Portfolio Design Configuration File
# Edit these settings to customize the data fetching behavior

[DATA]
# Date range for fetching historical data (YYYY-MM-DD format)
start_date = 2023-01-01
end_date = 2023-12-31

# Output directory for CSV files (relative to project root)
data_directory = data/raw

[LOGGING]
# Log file location (relative to project root)
log_file = logs/fetch_data.log

# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

[FETCHING]
# Show progress bar when downloading data (true/false)
show_progress = false

# Timeout for network requests in seconds
timeout = 30
